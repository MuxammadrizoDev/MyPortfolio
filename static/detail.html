<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Item Details | Muxammadrizo.dev</title>
    <link href="[https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@300;400;600;800;900&display=swap](https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@300;400;600;800;900&display=swap)" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=88.0">
    <style>
        .detail-card-wrapper { opacity: 0; transition: opacity 0.3s ease-in-out; }
        .detail-card-wrapper.loaded { opacity: 1; }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><a href="/" style="color: inherit; text-decoration: none;">Muxammadrizo<span style="color: #38bdf8;">.dev</span></a></div>
        <div class="nav-right-group">
            <button class="lang-btn single-lang-btn" id="lang-toggle-btn" type="button" onclick="cycleLanguage()">🌐 EN</button>
        </div>
    </nav>

    <section class="hero" style="padding-top: 40px; min-height: 80vh;">
        <div class="detail-card-wrapper" id="detail-card-wrapper" style="max-width: 850px; margin: 0 auto;">

            <a href="/" style="color: #38bdf8; text-decoration: none; font-size: 0.95rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px;" data-i18n="textBackHome">← Back to Portfolio</a>
            <br>

            <span id="detail-category" class="project-tag" style="display: inline-block; margin-bottom: 12px; color: #38bdf8; font-family: 'Fira Code', monospace; font-size: 0.85rem; font-weight: 700; text-transform: uppercase;">LOADING...</span>
            <h1 id="detail-title" style="font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; margin-bottom: 16px; color: #f1f5f9; line-height: 1.2; overflow-wrap: anywhere; word-break: break-word;">...</h1>

            <!-- Media Container -->
            <div id="detail-media-container" style="display: none; width: 100%; height: 400px; border-radius: 14px; overflow: hidden; margin: 24px 0; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(18, 26, 43, 0.7);"></div>

            <!-- Detail Information Box -->
            <div style="background: rgba(18, 26, 43, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 32px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);">

                <div id="detail-description" style="color: #94a3b8; line-height: 1.8; font-size: 1.05rem; margin-bottom: 24px; overflow-wrap: anywhere; word-break: break-word; white-space: normal;">
                    Loading details...
                </div>

                <!-- Custom Dynamic Tech Stack Wrapper -->
                <div id="tech-stack-wrapper" style="margin-bottom: 24px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.05); display: none;">
                    <strong style="font-size: 0.85rem; color: #38bdf8; font-family: 'Fira Code', monospace;" data-i18n="detailTechTitle">TECH STACK & TOOLS:</strong>
                    <p id="detail-tech" style="font-size: 0.95rem; font-weight: 600; margin-top: 6px; color: #f1f5f9; overflow-wrap: anywhere;"></p>
                </div>

                <div class="modal-actions" style="display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap;">
                    <a id="detail-github-link" href="#" target="_blank" class="btn" style="display: none; background: #334155; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; transition: background 0.2s ease;" data-i18n="detailViewCode">View Source Code ↗</a>
                    <a id="detail-live-link" href="#" target="_blank" class="btn" style="display: none; background: #38bdf8; color: #0b0f19; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; transition: background 0.2s ease;" data-i18n="detailVisitSite">Visit Live Site ↗</a>
                </div>
            </div>
        </div>
    </section>

    <footer style="text-align: center; padding: 30px 8%; color: #94a3b8; font-size: 0.85rem; border-top: 1px solid rgba(255, 255, 255, 0.1);">
        <p>© 2026 A'zamjonov Muxammadrizo. All rights reserved.</p>
    </footer>

    <script src="/static/script.js"></script>

    <script>
        function getYouTubeId(url) { let regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i; let match = url.match(regex); return match ? match[1] : null; }

        function renderDetailMedia(container, url, title) {
            if (!container) return;
            if (url && (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('/static/'))) {
                let ytId = getYouTubeId(url);
                if(ytId) {
                    container.innerHTML = `<iframe width="100%" height="100%" src="[https://www.youtube.com/embed/$](https://www.youtube.com/embed/$){ytId}" frameborder="0" allowfullscreen></iframe>`;
                    container.style.display = 'block';
                }
                else if (url.endsWith('.mp4')) {
                    container.innerHTML = `<video src="${escapeHTML(url)}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:contain;" onloadeddata="this.parentNode.style.display='block';" onerror="this.parentNode.style.display='none';"></video>`;
                }
                else {
                    container.innerHTML = `<img src="${escapeHTML(url)}" style="width:100%; height:100%; object-fit:contain;" onload="this.parentNode.style.display='block';" onerror="this.parentNode.style.display='none';" alt="${escapeHTML(title)}">`;
                }
            } else { container.style.display = 'none'; container.innerHTML = ''; }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // Global function to trigger a full content re-render when language changes
        window.renderDetailPage = async function() {
            const wrapper = document.getElementById('detail-card-wrapper');
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type') || 'project';
            const id = params.get('id');
            const titleParam = params.get('title');

            if (type === 'project' || type === 'blog') {
                try {
                    const res = await fetch('/api/projects');
                    if (res.ok) {
                        const projects = await res.json();
                        const proj = projects.find(p => (id && p.id == id) || (titleParam && p.title === titleParam));
                        if (proj) {
                            document.getElementById('page-title').textContent = `${escapeHTML(proj[`title_${currentLanguage}`] || proj.title)} | Muxammadrizo.dev`;
                            document.getElementById('detail-category').textContent = escapeHTML(proj.category.toUpperCase());
                            document.getElementById('detail-title').textContent = proj[`title_${currentLanguage}`] || proj.title;
                            document.getElementById('detail-description').innerHTML = proj[`description_${currentLanguage}`] || proj.description;

                            if (proj.tech_stack && proj.tech_stack.trim() !== "" && proj.tech_stack !== "Built via Visual Admin Builder") {
                                document.getElementById('tech-stack-wrapper').style.display = 'block';
                                document.getElementById('detail-tech').textContent = proj.tech_stack;
                            } else {
                                document.getElementById('tech-stack-wrapper').style.display = 'none';
                            }
                            if(proj.tech_stack !== "Built via Visual Admin Builder" && !proj.description.includes('<img') && !proj.description.includes('<video') && !proj.description.includes('<iframe')) {
                                renderDetailMedia(document.getElementById('detail-media-container'), proj.image_url, proj.title);
                            }
                            const ghBtn = document.getElementById('detail-github-link');
                            const liveBtn = document.getElementById('detail-live-link');
                            if (proj.github_link) { ghBtn.href = proj.github_link; ghBtn.style.display = 'inline-flex'; }
                            if (proj.live_link) { liveBtn.href = proj.live_link; liveBtn.style.display = 'inline-flex'; }
                            if (wrapper) wrapper.classList.add('loaded');
                            return;
                        }
                    }
                } catch (e) {}
            } else if (type === 'proof') {
                if (id) {
                    try {
                        const res = await fetch('/api/achievements');
                        if (res.ok) {
                            const items = await res.json();
                            const proof = items.find(a => a.id == id || a.title === titleParam);
                            if (proof) {
                                document.getElementById('page-title').textContent = `${escapeHTML(proof[`title_${currentLanguage}`] || proof.title)} | Muxammadrizo.dev`;
                                document.getElementById('detail-category').textContent = escapeHTML(proof.category.toUpperCase());
                                document.getElementById('detail-title').textContent = proof[`title_${currentLanguage}`] || proof.title;
                                document.getElementById('detail-description').innerHTML = proof[`description_${currentLanguage}`] || proof.description;
                                if(proof.photo_url && !proof.description.includes(proof.photo_url)) {
                                    renderDetailMedia(document.getElementById('detail-media-container'), proof.photo_url, proof.title);
                                }
                                if (proof.website_link) {
                                    const liveBtn = document.getElementById('detail-live-link');
                                    liveBtn.href = proof.website_link;
                                    liveBtn.textContent = "View Credential ↗";
                                    liveBtn.style.display = 'inline-flex';
                                }
                                if (wrapper) wrapper.classList.add('loaded');
                                return;
                            }
                        }
                    } catch(e) {}
                }
            }
            if (wrapper) wrapper.classList.add('loaded');
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            // FIXED: Analytics fires ONLY once per specific item per session
            if(id && !sessionStorage.getItem('tracked_item_' + id)) {
                try {
                    await fetch('/api/track-content', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: params.get('type') || 'project' }) });
                    sessionStorage.setItem('tracked_item_' + id, '1');
                } catch(e) {}
            }
            window.renderDetailPage();
        });
    </script>
</body>
</html>
