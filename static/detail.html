<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Item Details | Muxammadrizo.dev</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=38.0">
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo"><a href="/" style="color: inherit; text-decoration: none;">Muxammadrizo<span>.dev</span></a></div>
        <div class="nav-right-group">
            <a href="/" class="btn btn-secondary" style="height: 38px; padding: 0 16px; font-size: 0.85rem;">&larr; Back to Portfolio</a>
        </div>
    </nav>

    <!-- DETAIL CONTAINER SECTION -->
    <section class="hero" style="padding-top: 50px;">
        <div style="max-width: 850px; margin: 0 auto;">
            <a href="/" style="color: var(--accent-color); text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 24px;">&larr; Back to Home</a>

            <span id="detail-category" class="project-tag" style="display: inline-block; margin-bottom: 12px;">Loading...</span>
            <h1 id="detail-title" style="font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; margin-bottom: 16px;">Loading Title...</h1>

            <div id="detail-media-container" style="width: 100%; max-height: 480px; border-radius: 14px; overflow: hidden; margin: 24px 0; border: 1px solid var(--border-color); background: var(--card-bg);">
                <!-- Dynamic Media Renders Here -->
            </div>

            <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 32px; margin-bottom: 30px;">
                <h3 style="color: var(--accent-color); font-family: 'Fira Code', monospace; font-size: 1rem; margin-bottom: 12px;">OVERVIEW & ARCHITECTURE</h3>
                <div id="detail-description" style="color: #94a3b8; line-height: 1.8; font-size: 1.05rem; margin-bottom: 24px;">Loading description...</div>

                <div id="tech-stack-wrapper" style="margin-bottom: 24px;">
                    <strong style="font-size: 0.85rem; color: #38bdf8; font-family: 'Fira Code', monospace;">TECH STACK & TOOLS:</strong>
                    <p id="detail-tech" style="font-size: 0.95rem; font-weight: 600; margin-top: 6px; color: #f1f5f9;"></p>
                </div>

                <div class="modal-actions" style="display: flex; gap: 12px; margin-top: 24px;">
                    <a id="detail-github-link" href="#" target="_blank" class="btn" style="display: none; background: #334155; color: #fff;">View Source Code ↗</a>
                    <a id="detail-live-link" href="#" target="_blank" class="btn" style="display: none;">Visit Live Site ↗</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 A'zamjonov Muxammadrizo. All rights reserved.</p>
    </footer>

    <script>
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type') || 'project';
            const id = params.get('id') || '1';
            const titleParam = params.get('title');

            if (type === 'project') {
                try {
                    const res = await fetch('/api/projects');
                    if (res.ok) {
                        const projects = await res.json();
                        const proj = projects.find(p => p.id == id || p.title === titleParam) || projects[0];
                        if (proj) {
                            document.getElementById('page-title').textContent = `${proj.title} | Muxammadrizo.dev`;
                            document.getElementById('detail-category').textContent = proj.category.toUpperCase();
                            document.getElementById('detail-title').textContent = proj.title;
                            document.getElementById('detail-description').textContent = proj.description;
                            document.getElementById('detail-tech').textContent = proj.tech_stack;

                            const mediaContainer = document.getElementById('detail-media-container');
                            if (proj.image_url && proj.image_url.endsWith('.mp4')) {
                                mediaContainer.innerHTML = `<video src="${proj.image_url}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>`;
                            } else {
                                mediaContainer.innerHTML = `<img src="${proj.image_url || 'https://via.placeholder.com/800x450/151c2e/38bdf8?text=Project+Preview'}" style="width:100%; height:100%; object-fit:cover;" alt="${escapeHTML(proj.title)}">`;
                            }

                            const ghBtn = document.getElementById('detail-github-link');
                            const liveBtn = document.getElementById('detail-live-link');
                            if (proj.github_link) { ghBtn.href = proj.github_link; ghBtn.style.display = 'inline-block'; }
                            if (proj.live_link) { liveBtn.href = proj.live_link; liveBtn.style.display = 'inline-block'; }
                        }
                    }
                } catch (e) {
                    console.error("Error loading project detail:", e);
                }
            } else if (type === 'blog') {
                document.getElementById('page-title').textContent = `${titleParam || 'DevLog'} | Muxammadrizo.dev`;
                document.getElementById('detail-category').textContent = "STUDIO DEVLOG";
                document.getElementById('detail-title').textContent = titleParam || "Project Cube Island - Procedural Biomes";
                document.getElementById('detail-description').innerHTML = `
                    <p style="margin-bottom: 16px;">Detailed studio update on engineering volcanic tropical biomes in Unreal Engine 5.8.</p>
                    <p style="margin-bottom: 16px;"><strong>Key Enhancements:</strong></p>
                    <ul style="margin-left: 20px; line-height: 1.8;">
                        <li>Procedural Content Generation (PCG) foliage spawner rules for tropical palm trees and basalt rocks.</li>
                        <li>Volumetric Lumen lighting and fog density optimization for smooth 60 FPS performance.</li>
                        <li>Non-lethal geometric blaster physics and particle interaction.</li>
                    </ul>
                `;
                document.getElementById('detail-tech').textContent = "Unreal Engine 5.8, PCG Foliage, Lumen Lighting, C++";
                document.getElementById('detail-media-container').innerHTML = `<video src="https://assets.mixkit.co/videos/preview/mixkit-futuristic-city-with-flying-cars-42996-large.mp4" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>`;
            } else if (type === 'proof') {
                document.getElementById('page-title').textContent = `${titleParam || 'Achievement'} | Muxammadrizo.dev`;
                document.getElementById('detail-category').textContent = "ACADEMIC & RECOGNITION";
                document.getElementById('detail-title').textContent = titleParam || "Hackathon IT School Fergana";
                document.getElementById('detail-description').textContent = "Recognized for top academic performance, advanced algorithmic problem solving, and active backend project deployments at Hackathon IT School in Fergana.";
                document.getElementById('detail-tech').textContent = "Python, Computer Science Fundamentals, Algorithms";
                document.getElementById('detail-media-container').innerHTML = `<img src="https://via.placeholder.com/800x450/151c2e/38bdf8?text=Certificate+Proof" style="width:100%; height:100%; object-fit:cover;" alt="Proof">`;
            }
        });
    </script>
</body>
</html>
